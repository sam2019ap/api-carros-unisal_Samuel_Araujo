spring.application.name=carros

# ---- Banco de dados H2 (padrao) ----
# Salva em arquivo (./data/carrosdb), entao os dados continuam depois de reiniciar a aplicacao.
spring.datasource.url=jdbc:h2:file:./data/carrosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Para usar MySQL, comente as linhas do H2 acima e descomente estas ----
# spring.datasource.url=jdbc:mysql://localhost:3306/carros?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=SUA_SENHA

# Cria/atualiza a tabela automaticamente a partir da entidade Carro
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
